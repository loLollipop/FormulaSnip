[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "formulasnip"
version = "0.1.0"
description = "Offline Windows formula snipping and recognition prototype"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "FormulaSnip contributors" }]
dependencies = [
  # QtCore/QtGui/QtWidgets are all in Essentials; avoiding Addons saves
  # hundreds of MB in the packaged desktop application.
  "PySide6-Essentials>=6.8,<7",
  "Pillow>=10.4,<13",
  "latex2mathml>=3.77,<4",
  "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
rapid = [
  "rapid-latex-ocr==0.0.9",
  # rapid-latex-ocr imports requests for model downloads but omits it from
  # the package metadata.
  "requests>=2.32,<3",
]
paddle = [
  "paddleocr>=3.3,<4",
  "paddlepaddle>=3.3,<4; sys_platform == 'win32'",
  "tokenizers>=0.20,<1",
  "ftfy>=6.3,<7",
]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
formulasnip = "formulasnip.app:main"

[tool.hatch.build.targets.wheel]
packages = ["formulasnip"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
