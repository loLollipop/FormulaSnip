[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "formulasnip"
version = "0.2.9"
description = "Offline Windows formula snipping and recognition prototype"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "GPL-3.0-only" }
authors = [{ name = "FormulaSnip contributors" }]
dependencies = [
  "PySide6-Essentials>=6.8,<7",
  # QtWebEngine in Addons powers the offline MathJax preview.
  "PySide6-Addons>=6.8,<7",
  "Pillow>=10.4,<13",
  "latex2mathml>=3.77,<4",
  "requests>=2.32,<3",
  "mathcraft-ocr[cpu]==0.3.1",
]

[project.optional-dependencies]
dev = [
  # Asset-generation scripts use matplotlib; the application does not.
  "matplotlib>=3.9,<4",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]
packaging = [
  "pyinstaller>=6.11,<7",
]

[project.scripts]
formulasnip = "formulasnip.app:main"

[tool.hatch.build.targets.wheel]
packages = ["formulasnip"]

[tool.hatch.build.targets.wheel.shared-data]
"THIRD_PARTY_NOTICES.md" = "share/formulasnip/THIRD_PARTY_NOTICES.md"
"THIRD_PARTY_LICENSES" = "share/formulasnip/THIRD_PARTY_LICENSES"

[tool.hatch.build.targets.sdist]
include = [
  "/formulasnip",
  "/LICENSE",
  "/README.md",
  "/THIRD_PARTY_NOTICES.md",
  "/THIRD_PARTY_LICENSES",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
# MathCraft's ONNX CPU inference path is compatible with NumPy 1, which keeps
# the packaged runtime aligned with the current OpenCV dependency set.
override-dependencies = ["numpy>=1.26,<2"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
