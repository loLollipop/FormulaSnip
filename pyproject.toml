[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "formulasnip"
version = "0.2.4"
description = "Offline Windows formula snipping and recognition prototype"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "GPL-3.0-only" }
authors = [{ name = "FormulaSnip contributors" }]
dependencies = [
  # QtCore/QtGui/QtWidgets are all in Essentials; avoiding Addons saves
  # hundreds of MB in the packaged desktop application.
  "PySide6-Essentials>=6.8,<7",
  "Pillow>=10.4,<13",
  "latex2mathml>=3.77,<4",
  "matplotlib>=3.9,<4",
  "rapid-latex-ocr==0.0.9",
  # rapid-latex-ocr imports requests for model downloads but omits it from
  # the package metadata.
  "requests>=2.32,<3",
  "mathcraft-ocr[cpu]==0.3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]
packaging = [
  "pyinstaller>=6.11,<7",
]

[project.scripts]
formulasnip = "formulasnip.app:main"

[tool.hatch.build.targets.wheel]
packages = ["formulasnip"]

[tool.hatch.build.targets.sdist]
include = [
  "/formulasnip",
  "/LICENSE",
  "/README.md",
  "/THIRD_PARTY_NOTICES.md",
  "/THIRD_PARTY_LICENSES",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
# MathCraft 0.3.1 declares NumPy 2 although its ONNX CPU inference path is
# compatible with NumPy 1. RapidLaTeXOCR 0.0.9 still pins NumPy below 2.
override-dependencies = ["numpy>=1.26,<2"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
